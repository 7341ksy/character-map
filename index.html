<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#171717;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 6px}
.sub{color:#666;font-size:14px;margin-bottom:16px}
.viewer{background:#fff;border:1px solid #ddd;border-radius:16px;overflow:auto;max-height:72vh;box-shadow:0 4px 20px #00000012}
.canvas{position:relative;width:1456px;height:1024px;line-height:0}
.canvas img{display:block;width:1456px;height:1024px;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;z-index:3;border:2px solid transparent;background:transparent;border-radius:50%;cursor:pointer;padding:0}
.hotspot:hover,.hotspot:focus{border-color:#2563eb;background:#2563eb18;outline:none}
.panel{margin-top:14px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;min-height:160px}
.panel h2{font-size:19px;margin:0 0 8px}
.panel p{margin:0;line-height:1.65;color:#444;white-space:pre-wrap}
.badge{display:inline-block;font-size:12px;background:#eef2ff;color:#3730a3;padding:4px 8px;border-radius:999px;margin-bottom:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.action{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}
button.primary{background:#111827;color:#fff;border-color:#111827}
button.danger{background:#fff;color:#b91c1c;border-color:#fecaca}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px;font:inherit}
textarea{min-height:130px;resize:vertical;line-height:1.55}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.status{font-size:12px;color:#666;margin-top:8px;min-height:18px}
.note{font-size:12px;color:#777;margin-top:10px}
@media(max-width:600px){.wrap{padding:12px}.viewer{max-height:65vh}}
</style>

    return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  }

  function saveAll() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(details)); return true; }
    catch(e) { return false; }
  }

  function renderView(id, savedMessage="") {
    const d = details[id];
    panel.innerHTML = `
      <span class="badge">인물 정보</span>
      <h2>${escapeHtml(d.label)}</h2>
      <p>${escapeHtml(d.info)}</p>
      <div class="actions">
        <button class="action primary" type="button" id="editBtn">수정</button>
      </div>
      <div class="status">${escapeHtml(savedMessage)}</div>
    `;
    document.getElementById("editBtn").addEventListener("click", () => renderEdit(id));
  }

  function renderEdit(id) {
    const d = details[id];
    panel.innerHTML = `
      <span class="badge">인물 정보 수정</span>
      <label for="nameInput">이름</label>
      <input id="nameInput" value="${escapeHtml(d.label)}" maxlength="80">
      <label for="infoInput">상세정보</label>
      <textarea id="infoInput">${escapeHtml(d.info)}</textarea>
      <div class="actions">
        <button class="action primary" type="button" id="saveBtn">저장</button>
        <button class="action" type="button" id="cancelBtn">취소</button>
        <button class="action danger" type="button" id="resetBtn">이 인물 정보 초기화</button>
      </div>
      <div class="status">저장하면 이 브라우저에 유지됩니다.</div>
    `;

    document.getElementById("saveBtn").addEventListener("click", () => {
      const name = document.getElementById("nameInput").value.trim() || "이름 없음";
      const info = document.getElementById("infoInput").value;
      details[id] = {label:name, info:info};
      const ok = saveAll();
      renderView(id, ok ? "저장되었습니다." : "브라우저 저장공간에 저장하지 못했습니다.");
    });

    document.getElementById("cancelBtn").addEventListener("click", () => renderView(id));

    document.getElementById("resetBtn").addEventListener("click", () => {
      details[id] = {...defaults[id]};
      saveAll();
      renderView(id, "초기화되었습니다.");
    });
  }

  document.querySelectorAll(".hotspot").forEach(btn => {
    btn.addEventListener("click", () => renderView(btn.dataset.id));
  });
})();
</script>
</body>
</html>
